# TalentBridge AI: Nginx site (HTTP -> HTTPS, SPA + /api reverse proxy)
#
# Replace example.com with your real domain, and fix the certificate paths after running Certbot.
# Nothing in this file is a secret. Do not apply it until the deployment plan is approved.

# ---- HTTP: only used for ACME challenges and the redirect ---------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # SPA build output (npm run build -> client/dist copied to this folder)
    root  /var/www/talentbridge/current/client/dist;
    index index.html;

    # ---- security headers ------------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The SPA only talks to its own origin (API is proxied under /api). Fonts are self-hosted.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- compression ---------------------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript image/svg+xml;

    client_max_body_size 6m;   # resumes are limited to 5 MB by the app (admin-configurable up to 25 MB: raise here if you do)

    # ---- API ---------------------------------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # health probe for uptime monitors
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }

    # ---- static assets: hashed filenames are immutable ---------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback ----------------------------------------------------------------------------------------------------
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # never serve dotfiles
    location ~ /\. {
        deny all;
    }
}
